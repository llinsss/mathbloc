name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test application
        run: npm test

      - name: Test network configuration
        run: npm run test:network

      - name: Compile smart contracts
        run: npm run compile

      - name: Test smart contracts
        run: npm run test:contracts

      - name: Build application
        run: npm run build
